# Pattern and pinned actions from thetanuts-sdk .github/workflows/publish.yml.
# Runs when a GitHub release is published. The `npm-publish` environment must
# have required reviewers set in repo settings: that is the manual approval.
# Needs the NPM_TOKEN secret (an npm granular token with publish rights to the @odette-fi scope).
# --provenance needs a PUBLIC repository (it is public).
name: Publish Packages

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@odette-fi'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The tag must equal both package versions (one version for both).
      - name: Check release tag matches package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SDK=$(node -p "require('./packages/sdk/package.json').version")
          CLI=$(node -p "require('./packages/cli/package.json').version")
          DEP=$(node -p "require('./packages/cli/package.json').dependencies['@odette-fi/sdk']")
          echo "tag=$TAG sdk=$SDK cli=$CLI cli->sdk=$DEP"
          test "$TAG" = "$SDK" && test "$TAG" = "$CLI" && test "$DEP" = "$SDK"

      - name: TypeScript check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      - name: Drift check
        run: npm run drift

      - name: Install smoke test
        run: node scripts/smoke-install.mjs

      # SDK first: the CLI depends on this exact SDK version.
      # Each step skips a version that is already on npm (a version can never be
      # published twice), so a failed run can be re-run: if the SDK went out and
      # the CLI failed, the re-run publishes only the CLI.
      - name: Publish SDK
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name"); VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm; skipping."
          else
            npm publish --provenance --access public
          fi

      - name: Publish CLI
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name"); VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm; skipping."
          else
            npm publish --provenance --access public
          fi
